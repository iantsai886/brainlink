<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrainLink</title><link rel="stylesheet" href="./styles.css"><div id="app"></div><script type="module">
// Integration: a host shell must provide a BrainStore and connector services.
import { startApp } from './app.mjs';
