<details class="card" id="tidy-panel" hidden>
    <summary data-i18n="tidy.title"></summary>
    <p class="hint" data-i18n="tidy.hint"></p>
    <label><span data-i18n="tidy.vault"></span><select id="tidy-vault"></select></label>
    <div class="row"><button id="tidy-generate" type="button" class="primary" data-i18n="tidy.generate"></button><span role="status" id="tidy-status"></span></div>
    <div id="tidy-list" class="cards"></div>
    <button id="tidy-more" type="button" hidden data-i18n="tidy.loadMore"></button>
    <div class="row"><button id="tidy-preview-apply" type="button" data-i18n="tidy.previewApply"></button><button id="tidy-preview-dismiss" type="button" data-i18n="tidy.previewDismiss"></button></div>
    <pre id="tidy-preview" class="mono" hidden style="white-space:pre-wrap;max-height:420px;overflow:auto"></pre>
    <button id="tidy-confirm" class="primary" type="button" hidden data-i18n="tidy.confirm"></button>
  </details>
