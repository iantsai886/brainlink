<details class="card" id="memory-review-panel" hidden>
    <summary data-i18n="memoryReview.title"></summary>
    <p class="hint" data-i18n="memoryReview.hint"></p>
    <label><span data-i18n="memoryReview.vault"></span><select id="memory-review-vault"></select></label>
    <div class="row"><button id="memory-review-open" type="button" data-i18n="memoryReview.open"></button></div>
    <div id="memory-review-editor" hidden>
      <p class="muted" data-i18n="memoryReview.format"></p>
      <label><span data-i18n="memoryReview.note"></span><textarea id="memory-review-text" rows="12" style="width:100%;font-family:var(--mono)"></textarea></label>
      <div class="row"><button id="memory-review-save" type="button" data-i18n="memoryReview.save"></button><span id="memory-review-status" role="status"></span></div>
    </div>
  </details>
