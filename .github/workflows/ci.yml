name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run core and UI suites
        run: npm run test:all

  windows-package:
    name: Build unsigned Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer with pinned, checksum-verified Node.js
        shell: pwsh
        run: ./packaging/windows/build-windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainlink-windows-installer
          path: dist/BrainLink-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: Build unsigned macOS installer
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build universal package with pinned Node.js
        run: bash packaging/macos/build-pkg.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainlink-macos-installer
          path: dist/BrainLink-*.pkg*
          if-no-files-found: error
          retention-days: 7

  linux-package:
    name: Build Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build x64 and arm64 packages with pinned Node.js
        run: bash packaging/linux/build-linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brainlink-linux-packages
          path: |
            dist/brainlink-*.tar.gz*
            dist/brainlink_*.deb*
          if-no-files-found: error
          retention-days: 7
