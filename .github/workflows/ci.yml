name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run core and UI suites
        run: npm run test:all

  windows-package:
    name: Build unsigned Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer with pinned, checksum-verified Node.js
        shell: pwsh
        run: ./packaging/windows/build-windows.ps1

      - name: Smoke-test staged application runtime
        shell: pwsh
        run: |
          $node = Join-Path $PWD 'build/windows/stage/node/node.exe'
          $app = Join-Path $PWD 'build/windows/stage/app/bin/brainlink.mjs'
          $version = & $node $app --version
          if ($version -ne (Get-Content package.json | ConvertFrom-Json).version) { throw "Staged runtime failed: $version" }

      - name: Install, run and uninstall Windows package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Join-Path $PWD "dist/BrainLink-Setup-$version.exe"
          $installCode = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($installCode.ExitCode -ne 0) { throw "Installer failed with $($installCode.ExitCode)" }
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs/BrainLink'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'brainlink-win-smoke-profile'
          $vault = Join-Path $env:RUNNER_TEMP 'brainlink-win-smoke-vault'
          New-Item -ItemType Directory -Force $vault | Out-Null
          $version = & (Join-Path $installRoot 'bin/brainlink.cmd') --version
          if ($version -ne (Get-Content package.json | ConvertFrom-Json).version) { throw "Installed runtime failed: $version" }
          & (Join-Path $installRoot 'bin/brainlink.cmd') init --vault $vault --name Smoke
          $config = Join-Path $env:APPDATA 'BrainLink/config.json'
          if (-not (Test-Path $config)) { throw 'Installed app did not create its isolated config' }
          $uninstaller = Join-Path $installRoot 'unins000.exe'
          $uninstallCode = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstallCode.ExitCode -ne 0) { throw "Uninstaller failed with $($uninstallCode.ExitCode)" }
          if (Test-Path $installRoot) { throw 'Uninstaller left the application files behind' }
          if (-not (Test-Path $config)) { throw 'Uninstaller removed the user configuration' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainlink-windows-installer
          path: dist/BrainLink-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: Build unsigned macOS installer
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build universal package with pinned Node.js
        run: bash packaging/macos/build-pkg.sh

      - name: Expand and smoke-test packaged macOS runtime
        run: |
          version="$(node -p "require('./package.json').version")"
          pkgutil --expand-full "dist/BrainLink-$version.pkg" "$RUNNER_TEMP/brainlink-pkg"
          app="$(find "$RUNNER_TEMP/brainlink-pkg" -path '*/BrainLink.app/Contents/Resources/app/bin/brainlink.mjs' -print -quit)"
          test -n "$app"
          resources="${app%/app/bin/brainlink.mjs}"
          test "$("$resources/node/bin/node" "$app" --version)" = "$(node -p "require('./package.json').version")"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainlink-macos-installer
          path: dist/BrainLink-*.pkg*
          if-no-files-found: error
          retention-days: 7

  linux-package:
    name: Build Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build x64 and arm64 packages with pinned Node.js
        run: bash packaging/linux/build-linux.sh

      - name: Install and smoke-test x64 Debian package
        run: |
          sudo dpkg -i dist/brainlink_*_amd64.deb
          test "$(brainlink --version)" = "$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/brainlink-smoke-vault"
          BRAINLINK_HOME="$RUNNER_TEMP/brainlink-smoke-home" brainlink init --vault "$RUNNER_TEMP/brainlink-smoke-vault" --name Smoke
          sudo dpkg -r brainlink

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brainlink-linux-packages
          path: |
            dist/brainlink-*.tar.gz*
            dist/brainlink_*.deb*
          if-no-files-found: error
          retention-days: 7
